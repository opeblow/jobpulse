<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Warm ink card background with slight cream edge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#f6f1e8"/>
  <rect x="6" y="6" width="52" height="52" rx="11" fill="#21190f"/>

  <!-- "JP" monogram, centered -->
  <text x="32" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700"
        fill="#f6f1e8" text-anchor="middle">JP</text>

  <!-- Ember pulse accent -->
  <path d="M18 50 L24 50 L26.5 46 L31 55 L33.5 50 L40 50"
        fill="none" stroke="#c85212" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
